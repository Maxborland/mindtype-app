# =============================================================================
# GitHub Actions workflow for building MindType releases
# Triggers on tag push (v*) or manual dispatch
# =============================================================================
name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: MindType

jobs:
  # ==========================================================================
  # Prepare release version
  # ==========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' app/version.py | head -1)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # ==========================================================================
  # Build for Windows (PyArmor + PyInstaller)
  # ==========================================================================
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          $env:VERSION = "${{ needs.prepare.outputs.version }}"
          .\build_windows.ps1 -Version $env:VERSION -NoInstaller -Clean

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Create installer
        run: |
          $env:VERSION = "${{ needs.prepare.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION installer\windows.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/${{ env.APP_NAME }}-${{ needs.prepare.outputs.version }}-Setup.exe
          retention-days: 30

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  create-release:
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts/ -type f -name "*" | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MindType v${{ needs.prepare.outputs.version }}
          body: |
            ## MindType v${{ needs.prepare.outputs.version }}

            ### Downloads

            **Windows:**
            - `MindType-${{ needs.prepare.outputs.version }}-Setup.exe` - Windows installer

            **Linux & macOS:** Coming soon!

            ### Installation

            **Windows:** Download and run the setup executable.

          draft: false
          prerelease: false
          files: |
            artifacts/windows-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
