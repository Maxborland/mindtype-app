name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix; defaults to app/version.py"
        required: false
        default: ""

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  test-build-sign:
    name: Test, build and sign Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Determine and validate version
        id: version
        shell: pwsh
        run: |
          $AppVersion = python -c "from app.version import __version__; print(__version__)"
          if ("${{ github.event.inputs.version }}") {
            $Version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $Version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $Version = $AppVersion
          }
          if ("${{ github.ref_type }}" -eq "tag" -and $Version -ne $AppVersion) {
            throw "Tag version $Version does not match app/version.py $AppVersion"
          }
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Run regression gate
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q app
          python -m pytest -q

      - name: Build application
        shell: pwsh
        run: |
          .\build_windows.ps1 -Version "${{ steps.version.outputs.version }}" -NoInstaller -Clean
          if (-not (Test-Path "dist\MindType\MindType.exe")) {
            throw "PyInstaller output dist\MindType\MindType.exe was not created"
          }

      - name: Require signing secrets for tag releases and sign application
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $IsTag = "${{ github.ref_type }}" -eq "tag"
          $HasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)
          $HasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)
          if (-not ($HasCertificate -and $HasPassword)) {
            if ($IsTag) {
              throw "Tagged releases require WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD"
            }
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Host "Manual build will remain unsigned."
            exit 0
          }

          $CertificatePath = Join-Path $env:RUNNER_TEMP "mindtype-signing.pfx"
          "configured=true" >> $env:GITHUB_OUTPUT
          [IO.File]::WriteAllBytes(
            $CertificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          )
          $SignTool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $SignTool) {
            throw "signtool.exe was not found"
          }
          & $SignTool.FullName sign `
            /f $CertificatePath `
            /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
            /fd SHA256 `
            /tr https://timestamp.digicert.com `
            /td SHA256 `
            "dist\MindType\MindType.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Application signing failed"
          }
          "signtool_path=$($SignTool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed"
          }
          $Installer = "dist\MindType-${{ steps.version.outputs.version }}-Setup.exe"
          if (-not (Test-Path $Installer)) {
            throw "Expected installer $Installer was not created"
          }

      - name: Sign and verify installer
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $Installer = "dist\MindType-${{ steps.version.outputs.version }}-Setup.exe"
          $CertificatePath = Join-Path $env:RUNNER_TEMP "mindtype-signing.pfx"
          & "${{ steps.signing.outputs.signtool_path }}" sign `
            /f $CertificatePath `
            /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
            /fd SHA256 `
            /tr https://timestamp.digicert.com `
            /td SHA256 `
            $Installer
          if ($LASTEXITCODE -ne 0) {
            throw "Installer signing failed"
          }
          foreach ($File in @("dist\MindType\MindType.exe", $Installer)) {
            $Signature = Get-AuthenticodeSignature $File
            if ($Signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for ${File}: $($Signature.Status)"
            }
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $Installer = "dist\MindType-${{ steps.version.outputs.version }}-Setup.exe"
          $Hash = (Get-FileHash $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $(Split-Path $Installer -Leaf)" |
            Set-Content -Encoding ascii "$Installer.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/MindType-${{ steps.version.outputs.version }}-Setup.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: |
            dist/MindType-${{ steps.version.outputs.version }}-Setup.exe
            dist/MindType-${{ steps.version.outputs.version }}-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $CertificatePath = Join-Path $env:RUNNER_TEMP "mindtype-signing.pfx"
          Remove-Item -LiteralPath $CertificatePath -Force -ErrorAction SilentlyContinue

  release:
    name: Publish GitHub Release
    needs: test-build-sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-artifacts
          path: artifacts

      - name: Publish signed Windows release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MindType v${{ needs.test-build-sign.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*
